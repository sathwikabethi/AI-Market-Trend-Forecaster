# CareSense AI (Nginx) - single-domain setup
#
# Assumes:
# - Frontend build output is copied to: /var/www/caresense
# - Backend is running on: http://127.0.0.1:8002
# - API is accessed at /api/* (frontend default)
#
# Replace "example.com" and TLS paths for your domain.
#
# Typical include path:
# - Debian/Ubuntu: /etc/nginx/sites-enabled/*.conf (inside http { ... })

server {
    listen 80;
    server_name example.com;

    # Allow ACME challenges (certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Frontend (Vite build output).
    root /var/www/caresense;
    index index.html;

    # SPA routing: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API: strip /api prefix and forward to FastAPI.
    location /api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Helpful for SSE/streaming endpoints and long requests.
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

